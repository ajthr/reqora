name: reqora

services:
  api:
    build:
      context: .
      target: api
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REQORA_PORT:-5173}:80"
    restart: unless-stopped
